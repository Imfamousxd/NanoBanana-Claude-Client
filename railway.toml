# Railway config-as-code for the DAM worker service (deploy/dam/README.md).
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/dam/Dockerfile"

[deploy]
startCommand = "sh deploy/dam/start.sh"
# ALWAYS, not ON_FAILURE with a retry cap: the liveness watchdog (DAM_WATCHDOG_MINUTES) exits 1 on a hung
# loop, and a capped policy would leave the worker dead after the 10th restart.
restartPolicyType = "ALWAYS"
